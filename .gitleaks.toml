title = "Line secret scanning configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Sparkle's Ed25519 verification key is intentionally public"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''^SPARKLE_PUBLIC_ED_KEY\s*=\s*[A-Za-z0-9+/]{43}=$''']
paths = ['''(^|/)Line/Config\.xcconfig$''']

[[allowlists]]
description = "Historical low-entropy base64 fixture used to test xcconfig padding"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''SPARKLE_PUBLIC_ED_KEY = cHVibGljLWtleQ== // public key''']
paths = ['''(^|/)scripts/release/update_appcast_test\.rb$''']
