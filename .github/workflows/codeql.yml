name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "appcast.xml"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "appcast.xml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: bash scripts/ci/select_xcode.sh

      - name: Cache Swift package sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/codeql-source-packages
          key: ${{ runner.os }}-${{ runner.arch }}-codeql-spm-${{ steps.xcode.outputs.cache_key }}-v1-${{ hashFiles('Line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Line.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-codeql-spm-${{ steps.xcode.outputs.cache_key }}-v1-

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -skipMacroValidation \
            -resolvePackageDependencies \
            -project Line.xcodeproj \
            -scheme Line \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/codeql-source-packages"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        run: |
          xcodebuild \
            -skipMacroValidation \
            -project Line.xcodeproj \
            -scheme Line \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/codeql-source-packages" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
