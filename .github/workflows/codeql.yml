name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d "/Applications/Xcode_26.4.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.4.app"
          elif [[ -d "/Applications/Xcode_26.4.1.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.4.1.app"
          elif [[ -d "/Applications/Xcode_26.5.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.5.app"
          elif [[ -d "/Applications/Xcode_26.6.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.6.app"
          fi
          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        run: |
          xcodebuild \
            -skipMacroValidation \
            -project Line.xcodeproj \
            -scheme Line \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
