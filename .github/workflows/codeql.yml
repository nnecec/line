name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "appcast.xml"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "appcast.xml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: bash scripts/ci/select_xcode.sh

      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/codeql-source-packages
          key: ${{ runner.os }}-${{ runner.arch }}-codeql-spm-${{ steps.xcode.outputs.cache_key }}-v1-${{ hashFiles('Line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Line.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-codeql-spm-${{ steps.xcode.outputs.cache_key }}-v1-

      - name: Resolve package dependencies
        run: |
          xcodebuild \
            -skipMacroValidation \
            -resolvePackageDependencies \
            -project Line.xcodeproj \
            -scheme Line \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/codeql-source-packages"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        run: |
          xcodebuild \
            -skipMacroValidation \
            -project Line.xcodeproj \
            -scheme Line \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.build/codeql-source-packages" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
