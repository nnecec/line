name: Unsigned Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric app version, e.g. 1.4.4"
        required: true
        default: "0.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish unsigned packages
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            APP_VERSION=${RELEASE_TAG#v}
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual unsigned releases must be dispatched from main."
              exit 1
            fi
            APP_VERSION="$REQUESTED_VERSION"
            RELEASE_TAG="v$APP_VERSION"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Release tag must look like v1.4.4."
            exit 1
          fi

          MAIN_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN_COMMIT"; then
            echo "Unsigned releases must point to a commit from main."
            exit 1
          fi

          OTHER_RELEASE_TAGS=$(git tag --points-at "$GITHUB_SHA" \
            | grep -E '^v[0-9]+(\.[0-9]+){2}$' \
            | grep -vx "$RELEASE_TAG" || true)
          if [[ -n "$OTHER_RELEASE_TAGS" ]]; then
            echo "This commit already has another release tag:"
            echo "$OTHER_RELEASE_TAGS"
            exit 1
          fi

          APP_BUILD=$(git rev-list --count HEAD)
          if [[ ! "$APP_BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build number must be a positive integer."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "$RELEASE_TAG already points to a different commit."
              exit 1
            fi
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_build=$APP_BUILD" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          if [[ -d "/Applications/Xcode_26.4.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.4.app"
          fi
          xcodebuild -version

      - name: Build unsigned packages
        run: scripts/release/build_unsigned_package.sh

      - name: Verify checksums
        run: cd dist && shasum -a 256 -c SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Line-unsigned-${{ steps.metadata.outputs.app_version }}-${{ steps.metadata.outputs.app_build }}
          path: |
            dist/Line-unsigned.dmg
            dist/Line-unsigned.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/Line-unsigned.dmg
            dist/Line-unsigned.zip
            dist/SHA256SUMS.txt

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/Line-unsigned.dmg \
            dist/Line-unsigned.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Line $APP_VERSION (unsigned)" \
            --notes "This build is not signed with an Apple Developer ID and is not notarized. macOS may require manual approval in Privacy & Security before opening it." \
            --draft

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/line-unsigned-release.XXXXXX")
          gh release download "$RELEASE_TAG" \
            --dir "$VERIFY_DIR" \
            --pattern "Line-unsigned.dmg" \
            --pattern "Line-unsigned.zip" \
            --pattern "SHA256SUMS.txt"
          (
            cd "$VERIFY_DIR"
            shasum -a 256 -c SHA256SUMS.txt
          )

          ASSET_NAMES=$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort | join("\n")')
          EXPECTED_ASSET_NAMES=$(printf '%s\n' Line-unsigned.dmg Line-unsigned.zip SHA256SUMS.txt)
          test "$ASSET_NAMES" = "$EXPECTED_ASSET_NAMES"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease
