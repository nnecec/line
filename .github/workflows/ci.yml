name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests and Coverage
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d "/Applications/Xcode_26.4.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.4.app"
          elif [[ -d "/Applications/Xcode_26.4.1.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.4.1.app"
          elif [[ -d "/Applications/Xcode_26.5.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.5.app"
          elif [[ -d "/Applications/Xcode_26.6.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.6.app"
          fi
          xcodebuild -version

      # Cache key includes Package.resolved (dependency pin graph) and project.pbxproj
      # (package refs / build settings). Bump the v1 suffix if caches go green-but-stale.
      - name: Cache SPM and DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            Line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: ${{ runner.os }}-xcode-v1-${{ hashFiles('Line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Line.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-v1-

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Line.xcodeproj -scheme Line

      - name: Test release tooling
        run: ruby scripts/release/update_appcast_test.rb

      - name: Build Line
        run: xcodebuild -project Line.xcodeproj -scheme Line -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          # End-to-end tests need Accessibility + a real frontmost window.
          # Keep them out of the required unit job so CI green means pure logic passed.
          xcodebuild test \
            -project Line.xcodeproj \
            -scheme Line \
            -destination 'platform=macOS' \
            -skip-testing:LineTests/EndToEndIntegrationTests \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Enforce calculator coverage floor
        run: scripts/ci/check_calculator_coverage.sh "$RUNNER_TEMP/UnitTests.xcresult"

      - name: Smoke-archive release scheme
        run: |
          xcodebuild \
            archive \
            -project Line.xcodeproj \
            -scheme "Line (GH ACTIONS)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Line.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            VERSION=1.2.3 \
            BUILD_NUMBER=123

  integration-tests:
    name: Integration Tests (Accessibility)
    runs-on: macos-26
    timeout-minutes: 30
    # GitHub-hosted runners normally lack Accessibility permission.
    # This job still runs so skip/pass counts are visible; it must not hide real failures.
    continue-on-error: false

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d "/Applications/Xcode_26.4.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.4.app"
          elif [[ -d "/Applications/Xcode_26.4.1.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.4.1.app"
          elif [[ -d "/Applications/Xcode_26.5.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.5.app"
          elif [[ -d "/Applications/Xcode_26.6.app" ]]; then
            sudo xcode-select -s "/Applications/Xcode_26.6.app"
          fi
          xcodebuild -version

      # Same SPM/DerivedData key as unit-tests so both jobs can share warm caches.
      - name: Cache SPM and DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            Line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          key: ${{ runner.os }}-xcode-v1-${{ hashFiles('Line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Line.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode-v1-

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Line.xcodeproj -scheme Line

      - name: Run end-to-end integration tests
        id: integration
        run: |
          set -euo pipefail
          set -o pipefail
          LOG="$RUNNER_TEMP/integration-tests.log"
          # XCTSkip is a pass for xcodebuild. Real assertion failures still fail the job.
          xcodebuild test \
            -project Line.xcodeproj \
            -scheme Line \
            -destination 'platform=macOS' \
            -only-testing:LineTests/EndToEndIntegrationTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOG"

          # Match classic XCTest lines and newer "Test skipped/passed/failed" summaries.
          SKIP_COUNT=$(grep -Eic 'Test Case .* skipped|Test skipped' "$LOG" || true)
          FAIL_COUNT=$(grep -Eic 'Test Case .* failed|Test failed|failed \(' "$LOG" || true)
          PASS_COUNT=$(grep -Eic 'Test Case .* passed|Test passed' "$LOG" || true)

          {
            echo "### Integration test summary"
            echo ""
            echo "| Result | Count |"
            echo "| --- | ---: |"
            echo "| passed | ${PASS_COUNT} |"
            echo "| skipped | ${SKIP_COUNT} |"
            echo "| failed | ${FAIL_COUNT} |"
            echo ""
            if [[ "$SKIP_COUNT" -gt 0 && "$PASS_COUNT" -eq 0 && "$FAIL_COUNT" -eq 0 ]]; then
              echo "All integration cases were **explicitly skipped** (typical on runners without Accessibility permission or a controllable frontmost window)."
              echo "Unit Tests and Coverage remains the required correctness gate."
            elif [[ "$PASS_COUNT" -gt 0 ]]; then
              echo "At least one integration case **executed** on this runner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "passed=${PASS_COUNT}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIP_COUNT}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAIL_COUNT}" >> "$GITHUB_OUTPUT"
