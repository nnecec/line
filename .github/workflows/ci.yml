name: CI

on:
  workflow_dispatch:
    inputs:
      require_real_integration:
        description: Require at least one executed Accessibility integration test
        required: false
        default: false
        type: boolean
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "appcast.xml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests and Coverage
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: bash scripts/ci/select_xcode.sh

      # Cache key includes Package.resolved (dependency pin graph) and project.pbxproj
      # (package refs / build settings), plus the exact Xcode build.
      - name: Cache SPM and DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.cache_key }}-v2-${{ hashFiles('Line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Line.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.cache_key }}-v2-

      - name: Resolve package dependencies
        # Headless runners cannot approve Swift macros interactively. Scribe is
        # pinned to an exact revision in Package.resolved.
        run: xcodebuild -skipMacroValidation -resolvePackageDependencies -project Line.xcodeproj -scheme Line

      - name: Test release tooling
        run: |
          ruby scripts/release/update_appcast_test.rb
          ruby scripts/release/build_package_test.rb

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          # End-to-end tests need Accessibility + a real frontmost window.
          # Keep them out of the required unit job so CI green means pure logic passed.
          xcodebuild test \
            -skipMacroValidation \
            -project Line.xcodeproj \
            -scheme Line \
            -destination 'platform=macOS' \
            -skip-testing:LineTests/EndToEndIntegrationTests \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Enforce calculator coverage floor
        run: scripts/ci/check_calculator_coverage.sh "$RUNNER_TEMP/UnitTests.xcresult"

      - name: Smoke-archive release scheme
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          xcodebuild \
            -skipMacroValidation \
            archive \
            -project Line.xcodeproj \
            -scheme "Line (GH ACTIONS)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Line.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            VERSION=1.2.3 \
            BUILD_NUMBER=123

      - name: Smoke-test unsigned release package
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/line-package"
          VERSION=0.0.0 BUILD_NUMBER=1 ALLOW_UNSIGNED=1 OUTPUT_DIR="$OUT" scripts/release/build_package.sh
          test -f "$OUT/Line-0.0.0.zip"
          test -f "$OUT/Line-0.0.0.dmg"
          test -f "$OUT/SHA256SUMS.txt"
          PLIST="$OUT/DerivedData/Build/Products/Release/Line.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" | grep -Fx '0.0.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" | grep -Fx '1'
          (cd "$OUT" && shasum -a 256 Line-0.0.0.zip Line-0.0.0.dmg) | diff -u - SHA256SUMS.txt

  integration-tests:
    name: Integration Tests (Accessibility)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 30
    # GitHub-hosted runners normally lack Accessibility permission.
    # Keep this manual so maintainers can inspect skip/pass counts without taxing every change.
    continue-on-error: false
    env:
      REQUIRE_REAL_INTEGRATION: ${{ inputs.require_real_integration && '1' || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: bash scripts/ci/select_xcode.sh

      # Same SPM/DerivedData key as unit-tests so both jobs can share warm caches.
      - name: Cache SPM and DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.cache_key }}-v2-${{ hashFiles('Line.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Line.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.cache_key }}-v2-

      - name: Resolve package dependencies
        # Headless runners cannot approve Swift macros interactively. Scribe is
        # pinned to an exact revision in Package.resolved.
        run: xcodebuild -skipMacroValidation -resolvePackageDependencies -project Line.xcodeproj -scheme Line

      - name: Run end-to-end integration tests
        id: integration
        run: |
          set -euo pipefail
          set -o pipefail
          LOG="$RUNNER_TEMP/integration-tests.log"
          # XCTSkip is represented in the XCTest result bundle. Real assertion failures
          # remain failures; a missing test bundle is also reported as a failure.
          set +e
          xcodebuild test \
            -skipMacroValidation \
            -project Line.xcodeproj \
            -scheme Line \
            -destination 'platform=macOS' \
            -only-testing:LineTests/EndToEndIntegrationTests \
            -resultBundlePath "$RUNNER_TEMP/IntegrationTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$LOG"
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          set -e

          # Read XCTest's result bundle instead of inferring counts from localized log text.
          set +e
          read -r DISCOVERED_COUNT PASS_COUNT SKIP_COUNT FAIL_COUNT < <(
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/IntegrationTests.xcresult" \
              --format json 2>/dev/null | python3 -c 'import json, sys; d=json.load(sys.stdin); print(d.get("totalTestCount", 0), d.get("passedTests", 0), d.get("skippedTests", 0), d.get("failedTests", 0))'
          )
          PARSE_STATUS=$?
          set -e
          if [[ "$PARSE_STATUS" -ne 0 ]]; then
            DISCOVERED_COUNT=0; PASS_COUNT=0; SKIP_COUNT=0; FAIL_COUNT=0
          fi
          EXECUTED_COUNT=$((PASS_COUNT + FAIL_COUNT))
          if [[ "$XCODEBUILD_STATUS" -ne 0 && "$FAIL_COUNT" -eq 0 ]]; then FAIL_COUNT=1; fi

          {
            echo "### Integration test summary"
            echo ""
            echo "| Result | Count |"
            echo "| --- | ---: |"
            echo "| discovered | ${DISCOVERED_COUNT} |"
            echo "| passed | ${PASS_COUNT} |"
            echo "| skipped | ${SKIP_COUNT} |"
            echo "| failed | ${FAIL_COUNT} |"
            echo "| executed | ${EXECUTED_COUNT} |"
            echo ""
            if [[ "$EXECUTED_COUNT" -eq 0 && "$FAIL_COUNT" -eq 0 ]]; then
              echo "Environment unavailable or no real integration case executed; this is **not** complete integration validation."
            elif [[ "$EXECUTED_COUNT" -gt 0 ]]; then
              echo "At least one integration case executed on this runner."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "discovered=${DISCOVERED_COUNT}" >> "$GITHUB_OUTPUT"
          echo "passed=${PASS_COUNT}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIP_COUNT}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAIL_COUNT}" >> "$GITHUB_OUTPUT"
          echo "executed=${EXECUTED_COUNT}" >> "$GITHUB_OUTPUT"

          if [[ "${REQUIRE_REAL_INTEGRATION:-0}" == "1" && "$EXECUTED_COUNT" -eq 0 ]]; then
            echo "REQUIRE_REAL_INTEGRATION=1 but zero integration cases executed." >&2
            exit 1
          fi
          if [[ "$FAIL_COUNT" -ne 0 ]]; then exit 1; fi
