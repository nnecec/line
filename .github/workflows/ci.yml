name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.4.app"

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Line.xcodeproj -scheme Line

      - name: Test release tooling
        run: ruby scripts/release/update_appcast_test.rb

      - name: Build Line
        run: xcodebuild -project Line.xcodeproj -scheme Line -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Test Line
        run: xcodebuild test -project Line.xcodeproj -scheme Line -destination 'platform=macOS'

      - name: Smoke-archive release scheme
        run: |
          xcodebuild \
            archive \
            -project Line.xcodeproj \
            -scheme "Line (GH ACTIONS)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Line.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            VERSION=1.2.3 \
            BUILD_NUMBER=123
