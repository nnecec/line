name: Development Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric app version, e.g. 1.4.4"
        required: true
        default: "0.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: development-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-build:
    name: Unsigned verification build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate build metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Version must look like 1.4.4."
            exit 1
          fi

          echo "APP_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: bash scripts/ci/select_xcode.sh

      - name: Build without signing credentials
        run: |
          set -euo pipefail
          xcodebuild \
            -project Line.xcodeproj \
            -scheme "Line (GH ACTIONS)" \
            -configuration Development \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            VERSION="$APP_VERSION" \
            BUILD_NUMBER="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package verification artifact
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Development -maxdepth 1 -name "Line.app" -type d | head -1)
          test -n "$APP_PATH"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/Line-unsigned.zip

      - name: Upload verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Line-unsigned-${{ github.run_number }}
          path: dist/Line-unsigned.zip
          if-no-files-found: error
          retention-days: 14
