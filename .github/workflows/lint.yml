name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Mint installs tools under ~/.mint; key on Mintfile so version bumps invalidate.
      - name: Cache Mint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-v1-${{ hashFiles('Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-v1-

      - name: Install Mint
        run: brew install mint

      - name: Check Swift formatting
        run: mint run swiftformat --lint . --reporter github-actions-log
