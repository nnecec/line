name: Lint

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "appcast.xml"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftFormat 0.62.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/swiftformat-0.62.1.zip"
          tool_dir="$RUNNER_TEMP/swiftformat-0.62.1"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat.zip
          echo "7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a  $archive" \
            | shasum -a 256 --check -
          unzip -q "$archive" -d "$tool_dir"
          "$tool_dir/swiftformat" --version

      - name: Check Swift formatting
        run: >-
          "$RUNNER_TEMP/swiftformat-0.62.1/swiftformat"
          --lint . --reporter github-actions-log
