name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.4.4"
        required: true
        type: string

concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Signed and notarized release
    runs-on: macos-26
    timeout-minutes: 75
    environment: stable-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write
    env:
      APP_NAME: Line
      MINIMUM_SYSTEM_VERSION: "26.0"
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Check out trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable release policy
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq '.enabled')" = "true"

      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Stable releases must be dispatched from main."
            exit 1
          fi

          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Version must look like 1.4.4."
            exit 1
          fi

          SPARKLE_PUBLIC_ED_KEY=$(ruby scripts/release/read_xcconfig_value.rb Line/Config.xcconfig SPARKLE_PUBLIC_ED_KEY)
          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "Line/Config.xcconfig must contain SPARKLE_PUBLIC_ED_KEY."
            exit 1
          fi

          PUBLIC_KEY_BYTES=$(ruby -rbase64 -e 'puts Base64.strict_decode64(ARGV.fetch(0)).bytesize' "$SPARKLE_PUBLIC_ED_KEY")
          if [[ "$PUBLIC_KEY_BYTES" != "32" ]]; then
            echo "SPARKLE_PUBLIC_ED_KEY must be a base64-encoded 32-byte Ed25519 public key."
            exit 1
          fi

          SPARKLE_FEED_URL=$(ruby scripts/release/read_xcconfig_value.rb Line/Config.xcconfig SPARKLE_FEED_URL)
          EXPECTED_FEED_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/appcast.xml"
          if [[ "$SPARKLE_FEED_URL" != "$EXPECTED_FEED_URL" ]]; then
            echo "SPARKLE_FEED_URL must be $EXPECTED_FEED_URL."
            exit 1
          fi

          CONFIG_VERSION=$(ruby scripts/release/read_xcconfig_value.rb Line/Config.xcconfig VERSION)
          APP_BUILD=$(ruby scripts/release/read_xcconfig_value.rb Line/Config.xcconfig BUILD_NUMBER)
          if [[ "$CONFIG_VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "Bump VERSION in Line/Config.xcconfig to $REQUESTED_VERSION through a reviewed pull request before releasing."
            exit 1
          fi
          if [[ ! "$APP_BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "BUILD_NUMBER in Line/Config.xcconfig must be a positive integer."
            exit 1
          fi

          TAG="v${REQUESTED_VERSION}"
          RELEASE_EXISTS=false
          RELEASE_IS_DRAFT=false
          RELEASE_ALREADY_PUBLISHED=false

          git fetch --tags --force
          APP_VERSION="$REQUESTED_VERSION" APP_BUILD="$APP_BUILD" \
            ruby scripts/release/validate_appcast_version.rb
          APP_VERSION="$REQUESTED_VERSION" APP_BUILD="$APP_BUILD" \
            ruby scripts/release/validate_release_history.rb

          PENDING_APPCAST_PRS=$(gh pr list --state open --limit 100 --json headRefName,url \
            --jq ".[] | select(.headRefName | startswith(\"automation/appcast-v\")) | select(.headRefName != \"automation/appcast-$TAG\") | .url")
          if [[ -n "$PENDING_APPCAST_PRS" ]]; then
            echo "Merge or close pending appcast pull requests before releasing:"
            echo "$PENDING_APPCAST_PRS"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to a different commit."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            RELEASE_IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [[ "$RELEASE_IS_DRAFT" == "false" ]]; then
              RELEASE_ALREADY_PUBLISHED=true
            fi
          fi

          echo "APP_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_EXISTS=$RELEASE_EXISTS" >> "$GITHUB_ENV"
          echo "RELEASE_IS_DRAFT=$RELEASE_IS_DRAFT" >> "$GITHUB_ENV"
          echo "RELEASE_ALREADY_PUBLISHED=$RELEASE_ALREADY_PUBLISHED" >> "$GITHUB_ENV"

      - name: Download assets when resuming a published release
        if: ${{ env.RELEASE_ALREADY_PUBLISHED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern "Line.zip" \
            --pattern "Line.dmg" \
            --pattern "SHA256SUMS.txt" \
            --dir dist
          for EXPECTED_ASSET in Line.zip Line.dmg SHA256SUMS.txt; do
            test -f "dist/$EXPECTED_ASSET"
          done
          cd dist
          shasum -a 256 -c SHA256SUMS.txt

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.4.app"

      - name: Resolve package dependencies and Sparkle tools
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Line.xcodeproj \
            -scheme Line \
            -derivedDataPath "$DERIVED_DATA"

      - name: Install Developer ID certificate
        if: ${{ env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        env:
          DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEVELOPER_ID_CERT_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/line-signing.keychain-db"
          printf '%s' "$DEVELOPER_ID_CERT_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Archive and export signed app
        if: ${{ env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          mkdir -p dist

          xcodebuild \
            archive \
            -project Line.xcodeproj \
            -scheme "Line (GH ACTIONS)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath dist/Line.xcarchive \
            -derivedDataPath "$DERIVED_DATA" \
            VERSION="$APP_VERSION" \
            BUILD_NUMBER="$APP_BUILD" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application"

          xcodebuild \
            -exportArchive \
            -archivePath dist/Line.xcarchive \
            -exportPath dist/export \
            -exportOptionsPlist assets/ExportOptions.plist

          codesign --verify --deep --strict dist/export/Line.app

      - name: Notarize and staple app
        if: ${{ env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PWD: ${{ secrets.APPLE_ID_PWD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_ID"
          test -n "$APPLE_ID_PWD"

          ditto -c -k --sequesterRsrc --keepParent dist/export/Line.app dist/Line-notarization.zip
          xcrun notarytool submit dist/Line-notarization.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PWD" \
            --wait
          xcrun stapler staple dist/export/Line.app
          xcrun stapler validate dist/export/Line.app
          codesign --verify --deep --strict dist/export/Line.app
          spctl --assess --type execute --verbose=2 dist/export/Line.app

      - name: Package and notarize release assets
        if: ${{ env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PWD: ${{ secrets.APPLE_ID_PWD }}
        run: |
          set -euo pipefail
          rm -f dist/Line-notarization.zip
          ditto -c -k --sequesterRsrc --keepParent dist/export/Line.app dist/Line.zip

          mkdir -p dist/dmg-root
          ditto dist/export/Line.app dist/dmg-root/Line.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname Line \
            -srcfolder dist/dmg-root \
            -format UDZO \
            -ov \
            dist/Line.dmg

          xcrun notarytool submit dist/Line.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PWD" \
            --wait
          xcrun stapler staple dist/Line.dmg
          xcrun stapler validate dist/Line.dmg

          cd dist
          shasum -a 256 Line.zip Line.dmg > SHA256SUMS.txt

      - name: Attest release artifacts
        if: ${{ env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/Line.zip
            dist/Line.dmg

      - name: Create or update draft release
        if: ${{ env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release upload "$RELEASE_TAG" \
              dist/Line.dmg \
              dist/Line.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/Line.dmg \
              dist/Line.zip \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --draft
          fi

          ASSET_NAMES=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          ASSET_COUNT=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [[ "$ASSET_COUNT" != "3" ]]; then
            echo "Draft release must contain exactly three assets."
            exit 1
          fi
          for EXPECTED_ASSET in Line.dmg Line.zip SHA256SUMS.txt; do
            if ! grep -Fxq "$EXPECTED_ASSET" <<< "$ASSET_NAMES"; then
              echo "Draft release is missing $EXPECTED_ASSET."
              exit 1
            fi
          done

          VERIFY_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$VERIFY_DIR"
          gh release download "$RELEASE_TAG" \
            --pattern "Line.zip" \
            --pattern "Line.dmg" \
            --pattern "SHA256SUMS.txt" \
            --dir "$VERIFY_DIR"
          for EXPECTED_ASSET in Line.zip Line.dmg SHA256SUMS.txt; do
            test -f "$VERIFY_DIR/$EXPECTED_ASSET"
          done
          cd "$VERIFY_DIR"
          shasum -a 256 -c SHA256SUMS.txt

      - name: Publish GitHub release
        if: ${{ env.RELEASE_ALREADY_PUBLISHED != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify immutable release and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          IS_IMMUTABLE=$(gh release view "$RELEASE_TAG" --json isImmutable --jq '.isImmutable')
          if [[ "$IS_IMMUTABLE" != "true" ]]; then
            echo "Release immutability must be enabled before publishing."
            exit 1
          fi

          ASSET_COUNT=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          test "$ASSET_COUNT" = "3"

          RELEASE_VERIFIED=false
          for ATTEMPT in 1 2 3 4 5 6; do
            if gh release verify "$RELEASE_TAG"; then
              RELEASE_VERIFIED=true
              break
            fi
            if [[ "$ATTEMPT" == "6" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$RELEASE_VERIFIED" != "true" ]]; then
            echo "GitHub could not verify the immutable release attestation."
            exit 1
          fi

          for EXPECTED_ASSET in Line.zip Line.dmg SHA256SUMS.txt; do
            gh release verify-asset "$RELEASE_TAG" "dist/$EXPECTED_ASSET"
          done

          for PROVENANCE_ASSET in Line.zip Line.dmg; do
            gh attestation verify "dist/$PROVENANCE_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/heads/main" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Verify released application bundle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"

          EXTRACT_DIR=$(mktemp -d "$RUNNER_TEMP/released-app.XXXXXX")
          ditto -x -k dist/Line.zip "$EXTRACT_DIR"
          APP_PATH="$EXTRACT_DIR/Line.app"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          test -d "$APP_PATH"

          codesign --verify --deep --strict "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate dist/Line.dmg
          spctl --assess --type execute --verbose=2 "$APP_PATH"

          TEAM_IDENTIFIER=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          test "$TEAM_IDENTIFIER" = "$APPLE_TEAM_ID"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$INFO_PLIST")" = "com.nnecec.Line"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$INFO_PLIST")" = "$APP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$INFO_PLIST")" = "$APP_BUILD"

          EXPECTED_FEED=$(ruby scripts/release/read_xcconfig_value.rb Line/Config.xcconfig SPARKLE_FEED_URL)
          EXPECTED_PUBLIC_KEY=$(ruby scripts/release/read_xcconfig_value.rb Line/Config.xcconfig SPARKLE_PUBLIC_ED_KEY)
          test "$(plutil -extract SUFeedURL raw -o - "$INFO_PLIST")" = "$EXPECTED_FEED"
          test "$(plutil -extract SUPublicEDKey raw -o - "$INFO_PLIST")" = "$EXPECTED_PUBLIC_KEY"
          if plutil -extract SUEnableInstallerLauncherService raw -o - "$INFO_PLIST" >/dev/null 2>&1; then
            echo "Release unexpectedly enables Sparkle's sandbox-only installer launcher service."
            exit 1
          fi

      - name: Generate signed Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"

          SPARKLE_PUBLIC_ED_KEY=$(ruby scripts/release/read_xcconfig_value.rb Line/Config.xcconfig SPARKLE_PUBLIC_ED_KEY)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            ruby scripts/release/verify_sparkle_key_pair.rb

          SIGN_UPDATE=$(find "$DERIVED_DATA/SourcePackages/artifacts" -path "*/Sparkle/bin/sign_update" -type f | head -1)
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "Could not find Sparkle sign_update tool."
            exit 1
          fi

          SIGN_OUTPUT=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "dist/$APP_NAME.zip")
          ED_SIGNATURE=$(printf '%s\n' "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          ASSET_LENGTH=$(printf '%s\n' "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          test -n "$ED_SIGNATURE"
          test -n "$ASSET_LENGTH"

          PUBLISHED_AT=$(gh release view "$RELEASE_TAG" --json publishedAt --jq '.publishedAt')
          PUB_DATE=$(ruby -rtime -e 'puts Time.parse(ARGV.fetch(0)).rfc2822' "$PUBLISHED_AT")
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APP_NAME}.zip"
          export ED_SIGNATURE ASSET_LENGTH PUB_DATE RELEASE_URL
          ruby scripts/release/update_appcast.rb
          xmllint --noout appcast.xml

      - name: Open appcast pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/appcast-${RELEASE_TAG}"

          if git diff --quiet -- appcast.xml; then
            echo "Appcast is already current."
            exit 0
          fi

          verify_existing_appcast_branch() {
            git fetch origin "$BRANCH"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "Existing appcast branch is not based on the released commit."
              exit 1
            fi

            CHANGED_FILES=$(git diff --name-only "$GITHUB_SHA" FETCH_HEAD)
            if [[ "$CHANGED_FILES" != "appcast.xml" ]]; then
              echo "Existing appcast branch contains changes outside appcast.xml."
              exit 1
            fi

            if ! git diff --quiet FETCH_HEAD -- appcast.xml; then
              echo "Existing appcast branch does not match the generated feed."
              exit 1
            fi
          }

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            verify_existing_appcast_branch
            echo "Appcast pull request already exists: $EXISTING_PR"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            verify_existing_appcast_branch
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$BRANCH"
            git add appcast.xml

            git commit -m "chore: publish appcast for $RELEASE_TAG"
            gh auth setup-git
            git push origin HEAD:"$BRANCH"
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: publish appcast for $RELEASE_TAG" \
            --body "Publishes the signed Sparkle feed entry for $RELEASE_TAG after the GitHub Release assets were verified and published."

      - name: Delete temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/line-signing.keychain-db" || true
