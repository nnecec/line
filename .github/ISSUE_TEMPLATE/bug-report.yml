name: Bug Report
description: Report reproducible incorrect behavior in Line.
title: "[Bug]: "
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove passwords, private window titles, file paths, and personal information from logs and screenshots.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of the bug.
      placeholder: A brief summary of the problem and where it occurs.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Affected Scope
      description: What area is impacted?
      options:
        - User interface
        - Performance
        - Crash / Freeze
        - Data loss / Corruption
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the exact steps to reproduce the issue.
      placeholder: |
        1. [First step]
        2. [Second step]
        3. [and so on...]
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      description: How often does the issue occur?
      options:
        - Always
        - Often (≥70%)
        - Sometimes (30 to 70%)
        - Rarely (<30%)
        - Unable to reproduce again
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      description: Describe the expected result and the result you observed.
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screen Recordings / Screenshots
      description: Add screen recordings or screenshots to help explain the issue (if applicable).
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severely does this affect you?
      options:
        - Blocker (cannot proceed)
        - Critical (major functionality broken)
        - Major (workaround exists)
        - Minor (limited impact)
        - Trivial (cosmetic)
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      description: Apple menu, then About This Mac
      placeholder: macOS 26.0
    validations:
      required: true

  - type: input
    id: line_version
    attributes:
      label: Line Version
      description: You can find this in Line’s About tab in the settings window
      placeholder: Version 1.4.0 (1581)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Provide any additional information about this bug.
      placeholder: |
        - Logs or crash report (redact sensitive data)
        - Related issues: #123, #456
        - Network/proxy/VPN details
        - External display/monitor/usb-c dock etc.
        - Keyboard layout/language
        - Other relevant information
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Final Checks
      options:
        - label: My issue title is descriptive.
          required: true
        - label: This is a single bug (multiple bugs should be reported individually).
          required: true
        - label: I have looked to see if this is a duplicate of another bug report.
          required: true
        - label: I can help with further investigation.
          required: false
        - label: I can help with developing a fix for this issue.
          required: false

  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this bug.
